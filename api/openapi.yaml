  /api-keys:
    get:
      description: List API keys for the current user
      operationId: listApiKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/listApiKeys_200_response"
          description: API Key List
      security:
      - api_key:
        - keys:read
      summary: List API Keys
      tags:
      - API Keys
      x-codeSamples:
      - lang: JavaScript
        source: |
          import TourManager from '@rezkit/tours'

          const client = new TourManager({ api_key })
          const response = await client.apiKeys.list({ page: 1 })

          // Do something with the response
          response.data.map(key => console.log(key.id))
    post:
      description: |
        Create a new API key.

        Cannot create a key which has more permissions than the key used to create it.
      operationId: createApiKey
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createApiKey_request"
        required: true
      responses:
        "422":
          $ref: "#/components/responses/ValidationError"
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/createApiKey_201_response"
          description: API Key Created
      security:
      - api_key:
        - keys:read
        - keys:create
      summary: Create API Key
      tags:
      - API Keys
      x-codeSamples:
      - lang: JavaScript
        source: |
          import TourManager from '@rezkit/tours'

          const client = new TourManager({ api_key })
          const key = await client.apiKeys.create({
            name: 'My Awesome App',
            abilities: [ '*' ]
          })
  /api-keys/{id}:
    delete:
      description: |
        Delete an API Key.

        The API key used to make the request cannot be deleted.

        Deletion of API keys is permanent and irreversible.
      operationId: deleteApiKey
      parameters:
      - description: API Key ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: API Key Deleted
        "409":
          content:
            application/json:
              example:
                message: Cannot delete the same token used to make the request
              schema:
                $ref: "#/components/schemas/deleteApiKey_409_response"
          description: Cannot delete the API key used to make the request
      summary: Delete API Key
      tags:
      - API Keys
      x-codeSamples:
      - lang: JavaScript
        source: |
          import TourManager from '@rezkit/tours'

          const client = new TourManager({ api_key })

          await client.apiKeys.delete(id)
    patch:
      description: |
        Update an existing API Key. Cannot update the same key used to make the request.
        The underlying token is immutable and will not change if permissions or name are altered.
      operationId: updateApiKey
      parameters:
      - description: API Key ID
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateApiKey_request"
        required: true
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          content:
            application/json:
              example:
                message: Cannot update the same token used to make the request
              schema:
                $ref: "#/components/schemas/updateApiKey_409_response"
          description: "Cannot update, API key used to make the request is the same\
            \ as the API key to be updated"
        "422":
          $ref: "#/components/responses/ValidationError"
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
          description: API Key Updated
      summary: Update API Key
      tags:
      - API Keys
      x-codeSamples:
      - lang: JavaScript
        source: |
          import TourManager from '@rezkit/tours'

          const client = new TourManager({ api_key });

          const key = await client.apiKeys.update(id, { name: 'Updated Name' })

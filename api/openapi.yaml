        * `person` -- Pricing is given per person. Price is multiplied by number of passengers.
        * `unit_day` -- Pricing is given per day. Price is fixed for passengers, multiplied by duration (in days)
        * `person_day` -- Pricing is given per-person-day. Price is multiplied by number of passenger and duration (in days)

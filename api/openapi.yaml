      description: Filter holidays by code (prefix)
      explode: true
      in: query
      name: code
      required: false
      schema:
        type: string
      style: form
    HolidaySearchPage:
      description: Page number
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    HolidaySearchLimit:
      description: Maximum number of results to return
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
      style: form
    HolidaySearchOrder:
      description: Sort order
      explode: true
      in: query
      name: order
      required: false
      schema:
        $ref: "#/components/schemas/SortOrder"
      style: form
    HolidaySearchSort:
      description: Sort field
      explode: true
      in: query
      name: sort

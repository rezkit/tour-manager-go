  /holidays/{holiday_id}/versions/{version_id}/copy:
    parameters:
    - $ref: '#/components/parameters/HolidayIdPath'
    - $ref: '#/components/parameters/VersionIdPath'
    put:
      tags:
      - Holiday Versions
      summary: Copy Holiday Version
      description: >
        Copy a holiday version within the same holiday, including its
        locations, elements and options, itinerary entries, custom fields,
        and accommodation, extra and required-information attachments.
        The new version is unpublished by default.
      operationId: copyHolidayVersion
      security:
      - api_key:
        - holidays:copy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - code
              properties:
                name:
                  type: string
                  description: Name for the new version
                code:
                  type: string
                  minLength: 2
                  maxLength: 16
                  pattern: '^[A-Z0-9][A-Z0-9-_]*$'
                  description: Code for the new version

info:
  title: RezKit Tours Manager
  description: An application for managing small group tour products
  version: '2026.05'
  contact:
    url: https://rezkit.app
    name: RezKit
servers:
- description: Tour Manager
  url: https://tours.api.rezkit.app/
tags:
- name: Categories
  description: Category Management
- name: Holidays
  description: Holiday information management
- name: Holiday Versions
  description: Holiday Versions
- name: Images
  description: Manage the image library
- name: Departures
  description: Holiday Departures
- name: Elements
  description: Holiday Elements
- name: Prices
  description: Holiday Prices
- name: Itinerary
  description: Holiday Itinerary
- name: Locations
  description: Location information management
- name: Accommodation
  description: Accommodation information management
- name: Configuration
  description: Configuration management
- name: Fields
  description: Allows additional entity fields to be defined along with validation
    rules.
- name: Information
  description: General app information
- name: API Keys
  description: 'Create and Manage API keys for accessing tour data in external systems
    and programs.'
security:
- api_key: []
paths:
  /holidays/search:
    get:
      tags:
      - Holidays
      summary: Holiday Search
      operationId: searchHolidays
      parameters:
      - name: k
        in: query
        required: true
        description: Public search key
        schema:
          type: string
        example: rezkit
      - name: ccy
        in: query
        required: true
        description: Active search currency
        schema:
          type: string
          minLength: 3
          maxLength: 3
        example: GBP
      - name: q
        in: query
        description: Search query
        schema:
          type: string
          maxLength: 255
        example: walking holidays
      - name: o
        in: query
        description: Pagination offset
        example: 0
        schema:
          type: integer
          minimum: 0
      - name: i
        in: query
        description: Pagination page size
        example: 25
        schema:
          type: integer
          minimum: 1
          maximum: 200
      - name: j
        in: query
        description: Search join/filtering mode
        example: d
        schema:
          type: string
          enum:
          - a
          - d
      - name: pf
        in: query
        description: Minimum Price (inclusive)
        schema:
          type: number
          minimum: 0
        example: 123.45
      - name: pt
        in: query
        description: Maximum Price (inclusive)
        schema:
          type: number
          minimum: 0
        example: 5000
      - name: df
        in: query
        description: 'Date range lower bound (inclusive) Can be either a specific
          timestamp value or a relative date calculation e.g. `now+7d`

          '
        schema:
          type: string
        example: now+30d
      - name: dt
        in: query
        description: 'Date range upper bound (inclusive) Can be either a specific
          timestamp value or a relative date calculation e.g. `now+7d`

          '
        schema:
          type: string
        example: now+1y
      - name: l
        in: query
        description: Filter by location
        example:
          Region:
          - europe
        schema:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      - name: fh
        in: query
        description: 'Filter based on custom field properties, using an exact match
          only.

          '
        schema:
          type: object
          additionalProperties:
            oneOf:
            - type: number
            - type: string
            - type: boolean
      - name: fd
        in: query
        description: Filter departures based on custom field properties, using an
          exact match only
        schema:
          type: object
          additionalProperties:
            oneOf:
            - type: number
            - type: string
            - type: boolean
      - name: pi
        in: query
        description: Price histogram interval
        schema:
          type: integer
          minimum: 0
      - name: c0
        in: query
        description: Filter by Categories (Level 0)
        schema:
          type: array
          items:
            type: string
            maxLength: 96
      - name: c1
        in: query

    ApiKey:
      type: object
      title: API Key
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        last_used_at:
          type: string
          nullable: true
          format: date-time
          description: 'The timestamp of when the API key was most recently used to
            authorize a request.

            Will be `null` if the API key has not been used.

            '
        name:
          type: string
          example: My Awesome App
          description: A name to identify the purpose of this API Key
        abilities:
          $ref: '#/components/schemas/ApiKeyAbilities'
    ApiKeyAbilities:
      type: array
      title: API Key Abilities
      description: 'A list of abilities the token has which determine which methods
        it can use.


        An ability of `*` acts as a wildcard, granting all possible abilities.


        The `read:*` ability grants read on all.

        '
      example:
      - holidays:read
      - keys:read
      - locations:read
      items:
        type: string
        enum:
        - '*'
        - api_keys:create
        - api_keys:delete
        - api_keys:read
        - api_keys:update
        - fields:create
        - fields:read
        - fields:update
        - holidays:create
        - holidays:delete
        - holidays:read
        - holidays:undelete
        - holidays:update
        - locations:create
        - locations:delete
        - locations:read
        - locations:undelete
        - locations:update
    SortOrder:
      type: string

        introduction:
          type: string
        description:
          type: string
          description: Holiday description (HTML Content)
        ordering:
          type: integer
          description: Holiday order rank
        published:
          type: boolean
          description: Determines if the holiday is publicly viewable.
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'

components:
  schemas:
    ID:
      type: string
      minLength: 26
      maxLength: 26
      example: 01gpkgcy6t0m84czh8gy4kjatk
      description: 'A unique identifier. Unique system-wide to a single entity. Consists
        of 26 alphanumeric characters.

        '
      title: Unique Identifier
    CreatedAt:
      type: string
      format: date-time
      description: Creation timestamp
      title: Creation Timestamp
    UpdatedAt:
      type: string
      format: date-time
      description: Timestamp of most recent update
      title: Update Timestamp
    DeletedAt:
      type: string
      nullable: true
      format: date-time
      description: Timestamp of the item's deletion. Null if the item is not deleted.
      title: Deletion Timestamp
    Organization:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        rezkit_id:
          type: string
          description: Organization's RezKit ID
          example: dfjksdff443icvjwolkcn
        name:
          type: string
          example: TravelCo
          description: Organization Name
        currencies:
          description: 'List of presently available currencies.

            '
          type: array
          minItems: 1
          example:
          - AUD
          - CAD
          - EUR
          - GBP
          - USD
          items:
            type: string
            minLength: 3
            maxLength: 3
            pattern: /^[A-Z]{3}$/
        deposit_defaults:
          type: object
          additionalProperties: false
          properties:
            percentage:
              type: number
              minimum: 0
              maximum: 100
              description: Default percentage rate to apply as a deposit to all prices
                with no deposit value set
              example: 10
            balance_due:
              type: integer
              minimum: 0
              maximum: 1420
              description: Number of days before departure that a balance is due by
                default unless a specific date is set.
              example: 56
    User:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        organization_id:
          $ref: '#/components/schemas/ID'
        rezkit_id:
          type: string
          description: User's RezKit ID
        name:
          type: string
          example: John Smith
          description: User's full name
        email:
          type: string
          format: email
          example: john.smith@example.com
          description: User's e-mail address
        preferences:
          type: object
          description: User's preferences
          nullable: true
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
    CustomFieldsData:
      type: object
      title: Custom Field Data
      description: User-defined Fields Data
      additionalProperties:
        description: Field Value
        oneOf:
        - $ref: '#/components/schemas/TextFieldData'
        - $ref: '#/components/schemas/DateFieldData'
        - $ref: '#/components/schemas/NumberFieldData'
        - $ref: '#/components/schemas/BooleanFieldData'
        - $ref: '#/components/schemas/SelectFieldData'
    TextFieldData:
      title: Text Field
      description: Field containing string/text data
      type: object
      properties:
        type:
          type: string
          enum:
          - text
          - rich_text
          - url
          - color
        value:
          type: string
    DateFieldData:
      title: Date Field
      description: Field containing a date
      type: object
      properties:
        type:
          type: string
          enum:
          - date
        value:
          type: string
          format: date
          description: Date string
          example: '2023-01-17'
    NumberFieldData:
      title: Number Field
      type: object
      properties:
        type:
          type: string
          enum:
          - number
        value:
          type: number
    BooleanFieldData:
      title: Boolean Field
      type: object
      properties:
        type:
          type: string
          enum:
          - boolean
        value:
          type: boolean
    SelectFieldData:
      title: Selection Field
      type: object
      properties:
        type:
          type: string
          enum:
          - select
          - multi_select
        value:
          type: array
          description: 'Selected value(s).

            When `type` is "select" the value will contain either zero or one entries.

            When `type` is "multi_select" the value can contain multiple values.

            '
          items:
            type: string
    FieldDefinition:
      oneOf:
      - $ref: '#/components/schemas/TextFieldDefinition'
      - $ref: '#/components/schemas/DateFieldDefinition'
      - $ref: '#/components/schemas/NumberFieldDefinition'
      - $ref: '#/components/schemas/BooleanFieldDefinition'
      - $ref: '#/components/schemas/SelectionFieldDefinition'
    TextFieldDefinition:
      type: object
      title: Text Field
      additionalProperties: false
      required:
      - id
      - name
      - group_id
      - label
      - required
      - type
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          pattern: /^[a-z][a-z0-9_]*$/
          description: Field Name
        group_id:
          type: string
          description: Field group ID
        rank:
          type: integer
          minimum: 0
        label:
          type: string
        required:
          type: boolean
          description: Determines if this field is required
        type:
          type: string
          description: '## Field Type


            Determines the specific type of field.

            All the field types for a text field handle string values

            but the specific `type` value determines the semantic input type used


            * `text` - Plain text field

            * `rich_text` - Rich text editor

            * `url` - URL field, value must be a valid URL

            * `color` - Color field, value must a valid hex colour

            '
          enum:
          - text
          - rich_text
          - url
          - color
        minLength:
          type: integer
          minimum: 0
          description: Minimum value length
        maxLength:
          type: integer
          minimum: 0
          description: Minimum value length
        format:
          type: string
          description: RegEx for field value validation. Applicable only when `type`
            is `text`
    DateFieldDefinition:
      title: Date Field
      type: object
      required:
      - id
      - name
      - group_id
      - label
      - required
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          pattern: /^[a-z][a-z0-9_]*$/
          description: Field Name
        group_id:
          type: string
          description: Field group ID
        rank:
          type: integer
          minimum: 0
        label:
          type: string
        required:
          type: boolean
          description: Determines if this field is required
        type:
          type: string
          enum:
          - date
    NumberFieldDefinition:
      title: Numeric Field
      type: object
      required:
      - id
      - name
      - group_id
      - label
      - required
      - type
      - precision
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          pattern: /^[a-z][a-z0-9_]*$/
          description: Field Name
        group_id:
          type: string
          description: Field group ID
        rank:
          type: integer
          minimum: 0
        label:
          type: string
        required:
          type: boolean
          description: Determines if this field is required
        type:
          type: string
          enum:
          - number
        minimumValue:
          type: integer
          minimum: -1e12
          maximum: 1e12
          description: Minimum allowed value (inclusive)
        maximumValue:
          type: integer
          minimum: -1e12
          maximum: 1e12
          description: Maximum allowed value (inclusive)
        precision:
          type: integer
          minimum: 0
          maximum: 6
          description: Decimal places
    BooleanFieldDefinition:
      title: Boolean Field
      type: object
      required:
      - id
      - name
      - group_id
      - label
      - type
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          pattern: /^[a-z][a-z0-9_]*$/
          description: Field Name
        group_id:
          type: string
          description: Field group title
        rank:
          type: integer
          minimum: 0
        label:
          type: string
        type:
          type: string
          enum:
          - boolean
    SelectionFieldDefinition:
      title: Selection Field
      type: object
      required:
      - id
      - name
      - group
      - label
      - required
      - type
      - values
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          pattern: /^[a-z][a-z0-9_]*$/
          description: Field Name
        group:
          type: string
          description: Field group title
        rank:
          type: integer
          minimum: 0
        label:
          type: string
        required:
          type: boolean
          description: Determines if this field is required
        type:
          type: string
          enum:
          - select
          - select_multi
        values:
          type: array
          items:
            type: string
          minItems: 1
          description: Allowed values
    Holiday:
      type: object
      required:
      - id
      - name
      - code
      - introduction
      - description
      - rank
      - published
      - fields
      - created_at
      - updated_at
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
          description: Holiday Name
        code:
          type: string
          description: Holiday Code

  /organization/settings:
    put:
      summary: Update Settings
      tags:
      - Configuration
      description: Update the current organization's settings
      operationId: updateOrganizationSettings
      security:
      - api_key:
        - admin:update_settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                currencies:
                  description: 'List of currencies to provide pricing in. If a new
                    value is added to the list then uninitialized prices will be generated
                    for all values. If a value is removed, then existing prices will
                    be retained but no new prices will be generated.

                    '
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 3
                    maxLength: 3
                    pattern: /^[A-Z]{3}$/
                  example:
                  - AUD
                  - EUR
                  - GBP
                  - USD
                deposit_defaults:
                  type: object
                  additionalProperties: false
                  required:
                  - percentage
                  - balance_due
                  properties:
                    percentage:
                      type: number
                      minimum: 0
                      maximum: 100
                      description: Default percentage rate to apply as a deposit to
                        all prices with no deposit value set
                      example: 5
                    balance_due:
                      type: number
                      minimum: 0
                      maximum: 1420
                      description: Number of days before departure that a balance
                        is due by default unless a specific date is set.
                      example: 56
      responses:
        422:
          $ref: '#/components/responses/ValidationError'
        202:
          description: Organization Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /api-keys:
    get:
      tags:
      - API Keys
      security:
      - api_key:
        - keys:read
      summary: List API Keys
      description: List API keys for the current user
      operationId: listApiKeys
      x-codeSamples:
      - lang: JavaScript
        source: 'import TourManager from ''@rezkit/tours''


          const client = new TourManager({ api_key })

          const response = await client.apiKeys.list({ page: 1 })


          // Do something with the response

          response.data.map(key => console.log(key.id))

          '
      responses:
        200:
          description: API Key List
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  total:
                    type: integer
                    minimum: 0
                    description: Total number of matching holidays
                  current_page:
                    type: integer
                    minimum: 1
                    description: Current page number
                  last_page:
                    type: integer
                    minimum: 1
                    description: Total number of pages
                  from:
                    type: integer
                    minimum: 1
                    description: Index of the first result on the current page.
                  to:
                    type: integer
                    minimum: 1
                    description: Index of the last result on the current page.
                  data:
                    type: array
                    description: Matching Holidays
                    items:
                      $ref: '#/components/schemas/ApiKey'
    post:
      summary: Create API Key
      description: 'Create a new API key.


        Cannot create a key which has more permissions than the key used to create
        it.

        '
      tags:
      - API Keys
      security:
      - api_key:
        - keys:read
        - keys:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              properties:
                name:
                  type: string
                  minLength: 3
                  description: A name to identify the purpose of the API key
                  example: My awesome app
                abilities:
                  $ref: '#/components/schemas/ApiKeyAbilities'
      responses:
        422:
          $ref: '#/components/responses/ValidationError'
        201:
          description: API Key Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  plainTextToken:
                    type: string
                    description: 'The API Key itself.


                      **Warning: This is the _only_ time the key will be shown. If
                      the key is lost it _cannot_ be retrieved.**

                      '
                  accessToken:
                    $ref: '#/components/schemas/ApiKey'
      x-codeSamples:
      - lang: JavaScript
        source: "import TourManager from '@rezkit/tours'\n\nconst client = new TourManager({\
          \ api_key })\nconst key = await client.apiKeys.create({\n  name: 'My Awesome\
          \ App',\n  abilities: [ '*' ]\n})\n"
      operationId: createApiKey
  /api-keys/{id}:
    parameters:
    - name: id
      description: API Key ID
      in: path
      required: true
      schema:
        type: string
    delete:
      summary: Delete API Key
      tags:
      - API Keys
      description: 'Delete an API Key.


        The API key used to make the request cannot be deleted.


        Deletion of API keys is permanent and irreversible.

        '
      x-codeSamples:
      - lang: JavaScript
        source: 'import TourManager from ''@rezkit/tours''


          const client = new TourManager({ api_key })


          await client.apiKeys.delete(id)

          '
      responses:
        204:
          description: API Key Deleted
        409:
          description: Cannot delete the API key used to make the request
          content:
            application/json:
              example:
                message: Cannot delete the same token used to make the request
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cannot delete the same token used to make the request
      operationId: deleteApiKey
    patch:
      summary: Update API Key
      tags:
      - API Keys
      description: 'Update an existing API Key. Cannot update the same key used to
        make the request.

        The underlying token is immutable and will not change if permissions or name
        are altered.

        '
      x-codeSamples:
      - lang: JavaScript
        source: 'import TourManager from ''@rezkit/tours''


          const client = new TourManager({ api_key });


          const key = await client.apiKeys.update(id, { name: ''Updated Name'' })

          '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  nullable: false
                  description: New API Key name
                abilities:
                  $ref: '#/components/schemas/ApiKeyAbilities'
      responses:
        404:
          $ref: '#/components/responses/NotFound'
        409:
          description: Cannot update, API key used to make the request is the same
            as the API key to be updated
          content:
            application/json:
              example:
                message: Cannot update the same token used to make the request
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Cannot update the same token used to make the request
        422:
          $ref: '#/components/responses/ValidationError'
        202:
          description: API Key Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
      operationId: updateApiKey

  /holidays/reindex:
    post:
      tags:
      - Holidays
      summary: Trigger Search Reindex
      description: Triggers a full search index rebuild for the current tenant.
      operationId: reindexHolidays
      security:
      - api_key:
        - '*'
      responses:
        200:
          description: Reindex started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Batch ID
        429:
          $ref: '#/components/responses/GenericError'
  /holidays/suggest:
    get:
      tags:
      - Holidays
      summary: Holiday Suggestions
      description: Provides search suggestions for holidays.
      operationId: suggestHolidays
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      responses:
        200:
          description: Suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /holidays:
    get:
      tags:
      - Holidays
      security:
      - api_key:
        - holidays:read
      summary: List Holidays
      description: Filter, Sort and list Holidays
      operationId: listHolidays
      parameters:
      - $ref: '#/components/parameters/HolidaySearchSearch'
      - $ref: '#/components/parameters/HolidaySearchName'
      - $ref: '#/components/parameters/HolidaySearchCode'
      - $ref: '#/components/parameters/HolidaySearchPage'
      - $ref: '#/components/parameters/HolidaySearchLimit'
      - $ref: '#/components/parameters/HolidaySearchOrder'
      - $ref: '#/components/parameters/HolidaySearchSort'
      - $ref: '#/components/parameters/HolidaySearchTrash'
      - $ref: '#/components/parameters/HolidaySearchPublished'
      x-codeSamples:
      - lang: JavaScript
        source: 'import TourManager from ''@rezkit/tours''

          const c = new TourManager({ api_key })


          const holidays = await c.holidays.list({ published: 1, sort: ''code'', order:
          ''asc'' })


          holidays.data.forEach(h => console.log(h.code + "\t" + h.name))

          '
      responses:
        200:
          description: Holiday List
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    minimum: 0
                    description: Total number of matching holidays
                  current_page:
                    type: integer
                    minimum: 1
                    description: Current page number
                  last_page:
                    type: integer
                    minimum: 1
                    description: Total number of pages
                  from:
                    type: integer
                    minimum: 1
                    description: Index of the first result on the current page.
                  to:
                    type: integer
                    minimum: 1
                    description: Index of the last result on the current page.
                  data:
                    type: array
                    description: Matching Holidays
                    items:
                      $ref: '#/components/schemas/Holiday'
    post:
      tags:
      - Holidays
      security:
      - api_key:
        - holidays:create
      summary: Create Holiday
      description: Create a new Holiday
      requestBody:
        $ref: '#/components/requestBodies/CreateHoliday'
      operationId: createHoliday
      responses:
        201:
          description: Holiday Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holiday'
        422:
          $ref: '#/components/responses/ValidationError'
  /holidays/{id}:
    parameters:
    - name: id
      in: path
      description: Holiday ID
      required: true
      schema:
        type: string
        minLength: 26
        maxLength: 26
    get:
      tags:
      - Holidays
      summary: Get Holiday
      description: Get a holiday
      operationId: getHoliday
      security:
      - api_key:
        - holidays:read
      responses:
        200:
          description: Holiday
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holiday'
      x-codeSamples:
      - lang: JavaScript
        source: 'import TourManager from ''@rezkit/tours''


          const client = new TourManager({ api_key })

          const holiday = await client.holidays.find(id)

          '
    patch:
      tags:
      - Holidays
      security:
      - api_key:
        - holidays:update
      summary: Update Holiday
      description: Update an existing Holiday
      operationId: updateHoliday
      requestBody:
        $ref: '#/components/requestBodies/UpdateHoliday'
      responses:
        202:
          description: Holiday Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holiday'
        422:
          $ref: '#/components/responses/ValidationError'
        404:
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Holidays
      security:
      - api_key:
        - holidays:delete
      summary: Delete holiday
      description: Delete a holiday. Places the holiday into the trash where it will
        be automatically deleted.
      operationId: deleteHoliday
      x-codeSamples:
      - lang: JavaScript
        source: 'import TourManager from ''@rezkit/tours''

          const c = new TourManager({ api_key })


          const holiday = await c.holidays.find(id)

          await holiday.delete()

          '
      responses:
        204:
          description: Holiday Deleted
  /holidays/{id}/copy:
    parameters:
    - name: id
      in: path
      description: Holiday ID
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    put:
      tags:
      - Holidays
      summary: Copy Holiday
      description: Create a copy of an existing holiday.
      operationId: copyHoliday
      security:
      - api_key:
        - holidays:create
      responses:
        201:
          description: Holiday Copied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Holiday'
  /holidays/{id}/relations:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    get:
      tags:
      - Holidays
      summary: List Related Holidays
      description: List holidays related to the specified holiday.
      operationId: listRelatedHolidays
      responses:
        200:
          description: Related Holidays
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HolidayEdge'
    post:
      tags:
      - Holidays
      summary: Add Related Holiday
      description: Create a relationship between two holidays.
      operationId: addRelatedHoliday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - destination_id
              - category_id
              - published
              properties:
                destination_id:
                  $ref: '#/components/schemas/ID'
                category_id:
                  $ref: '#/components/schemas/ID'
                start_day:
                  type: integer
                  minimum: 0
                published:
                  type: boolean
                create_twin:
                  type: boolean
                  description: Also create the reverse relationship.
      responses:
        201:
          description: Relation Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayEdge'
  /holidays/{id}/relations/{relation}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    - name: relation
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    get:
      tags:
      - Holidays
      summary: Get Relation
      operationId: getRelatedHoliday
      responses:
        200:
          description: Relation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayEdge'
    patch:
      tags:
      - Holidays
      summary: Update Relation
      operationId: updateRelatedHoliday
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_id:
                  $ref: '#/components/schemas/ID'
                start_day:
                  type: integer
                published:
                  type: boolean
                ordering:
                  $ref: '#/components/schemas/OrderingCommand'
      responses:
        202:
          description: Relation Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HolidayEdge'
    delete:
      tags:
      - Holidays
      summary: Delete Relation
      operationId: deleteRelatedHoliday
      responses:
        204:
          description: Relation Deleted

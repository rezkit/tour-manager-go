        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        name:
          type: string
          title: Name
          description: Category name
        description:
          type: string
          description: Category rich-text description
        parent_id:
          $ref: '#/components/schemas/ID'
        published:
          type: boolean
          title: Published
          description: Category is published
        searchable:
          type: boolean
          title: Searchable
          description: Category is used for product search
        ancestors:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        children:
          type: array
          description: Recursive list of child categories.
          items:
            $ref: '#/components/schemas/Category'
    Element:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        deleted_at:
          $ref: '#/components/schemas/DeletedAt'
        version_id:
          $ref: '#/components/schemas/ID'
        category:
          $ref: '#/components/schemas/Category'
        name:
          type: string
        is_package:
          type: boolean
        published:
          type: boolean
        default_inventory:
          $ref: '#/components/schemas/Inventory'
        balance_due:
          description: Rule for balance payment due relative to departure date. No
            balance rule specified, global default applies.
          example: 56
          type: integer
          minimum: 0
          maximum: 1430
          nullable: true
        options:
          type: array
          description: 'Available options for the element. All options for an element
            share the same inventory.

            '
          items:
            $ref: '#/components/schemas/ElementOption'
    ElementOption:
      $ref: '#/components/schemas/ElementOptionProperties'
    Departure:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        deleted_at:
          $ref: '#/components/schemas/DeletedAt'
        version_id:
          $ref: '#/components/schemas/ID'
        range_type:
          $ref: '#/components/schemas/DepartureRangeType'
        start:
          type: string
          format: date-time
          description: Departure/Range start
        end:
          type: string
          format: date-time
          description: Departure/Range end
        source_id:
          description: ID of the departure this departure was copied from.
          example: null
          type: string
          allOf:
          - $ref: '#/components/schemas/ID'
          nullable: true
        published:
          type: boolean
        inventory:
          $ref: '#/components/schemas/Inventory'
        elements:
          type: array
          items:
            $ref: '#/components/schemas/DepartureElement'
    DepartureElement:
      type: object
      title: Departure Element
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        deleted_at:
          $ref: '#/components/schemas/DeletedAt'
        inventory:
          $ref: '#/components/schemas/Inventory'
        element:
          type: object
          properties:
            id:
              $ref: '#/components/schemas/ID'
            name:
              type: string
            is_package:
              type: boolean
            published:
              type: boolean
        balance_due:
          type: object
          properties:
            calculated:
              description: Determines if the given balance due date was calculated
                or has been explicitly set.
              type: boolean
            date:
              type: string
              format: date-time
              description: Date by which the full balance for the element must be
                paid.
        options:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/ElementOptionProperties'
            - type: object
              properties:
                prices:
                  title: Prices
                  description: 'Prices for this element-option on this departure,
                    one per operator currency. Exactly one item will always exist
                    in this list for every operator currency.

                    '
                  type: array
                  items:
                    $ref: '#/components/schemas/Price'
    Price:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        currency:
          title: Currency
          description: ISO Currency Code
          type: string
          pattern: /^[A-Z]{3}$/
          minLength: 3
          maxLength: 3
          example: USD
        on_sale:
          description: 'Determines if this price is available for sale. Configurations
            that are not possible or disallowed are disabled.

            '
          type: boolean
        initialized:
          description: 'Determines if the price has been initialized with a value.

            '
        value:
          type: number
          example: 1240.0
        deposit:
          type: object
          properties:
            calculated:
              type: boolean
              description: Determines if the given deposit amount has been calculated
                via a global rule
            value:
              type: number
              description: Deposit payment required to confirm a reservation.
    Inventory:
      discriminator:
        propertyName: type
        mapping:
          allocation: '#/components/schemas/AllocationInventory'
          on_request: '#/components/schemas/OnRequestInventory'
          free_sell: '#/components/schemas/FreeSellInventory'
      oneOf:
      - $ref: '#/components/schemas/AllocationInventory'
      - $ref: '#/components/schemas/OnRequestInventory'
      - $ref: '#/components/schemas/FreeSellInventory'
    AllocationInventory:
      type: object
      title: Allocation Inventory
      description: Inventory is based on allocation. The total number of units in
        inventory given by `capacity`
      required:
      - type
      - capacity
      properties:
        type:
          type: string
          enum:
          - allocation
        capacity:
          type: integer
          minimum: 0
          maximum: 10000
          description: Total number of units in inventory.
    OnRequestInventory:
      type: object
      title: On-Request Inventory
      description: Inventory is on-request. No capacity is held and inventory must
        be manually confirmed.
      required:
      - type
      - errata
      properties:
        type:
          type: string
          enum:
          - on_request
        errata:
          type: string
          description: Text describing the confirmation process required for inventory.
    FreeSellInventory:
      type: object
      title: Free-Sell Inventory
      description: Inventory is free-sell. Inventory is unlimited and always available.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - free_sell
    IDList:
      type: array
      title: List of IDs
      items:
        $ref: '#/components/schemas/ID'
    DepartureRangeType:
      type: string
      enum:
      - fixed
      - fixed_duration
      - flexible
    PriceUnit:
      title: Price Unit
      description: 'Determines the unit in which pricing is given. Valid options are:

        * `unit` -- Pricing is given per unit. Price is fixed for any duration or
        number of passengers.

        * `person` -- Pricing is given per person. Price is multiplied by number of
        passengers.

        * `unit_day` -- Pricing is given per day. Price is fixed for passengers, multiplied
        by duration (in days)

        * `person_day` -- Pricing is given per-person-day. Price is multiplied by
        number of passenger and duration (in days)

        '
      type: string
      enum:
      - unit
      - person
      - unit_day
      - person_day
    Occupancy:
      title: Occupancy
      type: object
      required:
      - from
      - to
      additionalProperties: false
      description: 'Occupancy determines the number of passengers which can be allocated
        to a single reservation. For example a hotel room with a double bed may have
        an occupancy of exactly two, meaning exactly two passengers must be assigned
        to the reservation.

        '
      properties:
        from:
          type: integer
          description: Minimum number of passengers required to book.
          minimum: 0
          maximum: 32
          example: 1
        to:
          type: integer
          description: Maximum number of passengers bookable per reservation.
          minimum: 0
          maximum: 32
          example: 2
    Image:
      title: Image
      type: object
      additionalProperties: false
      description: Image library entry
      required:
      - id
      - created_at
      - updated_at
      - title
      - width
      - height
      - file_name
      - file_size
      - thumbnail
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        title:
          title: Image Title
          type: string
        description:
          title: Image Description
          type: string
        width:
          title: Image Width (Pixels)
          type: integer
        height:
          title: Image Height (Pixels)
          type: integer
        file_name:
          title: Image File Name
          type: string
        file_size:
          title: Image File Size (Bytes)
          type: integer
          minimum: 0
        focus:
          title: Focus Point
          description: The coordinates of a pixel within the image which is the centre
            of focus for the subject.
          type: object
          properties:
            x:
              type: integer
              minimum: 0
            y:
              type: integer
              minimum: 0
        thumbnail:
          title: Thumbnail URL
          type: string
          format: url
    ElementOptionProperties:
      type: object
      title: Element Option
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
          $ref: '#/components/schemas/CreatedAt'
        updated_at:
          $ref: '#/components/schemas/UpdatedAt'
        deleted_at:
          $ref: '#/components/schemas/DeletedAt'
        category:
          $ref: '#/components/schemas/Category'
        published:
          description: Element option is published and viewable
          type: boolean
        web_bookable:
          description: 'Determines if the element option can be booked online. If
            false then the element can only be booked directly.

            '
          type: boolean
        is_lead:
          description: Determines if the prices for this option are valid candidates
            for a leading price.
          type: boolean
        name:
          description: Option Name
          type: string
        price_unit:
          $ref: '#/components/schemas/PriceUnit'
        occupancy:
          $ref: '#/components/schemas/Occupancy'
        constraints:
          description: 'Defines additional constraints for booking the option. Passengers
            and reservations must meet all specified constraints for a booking to
            be made.

            '
          type: object
          additionalProperties: true
          properties:
            min_age:
              type: integer
              minimum: 0
              maximum: 1000
              description: Minimum age of all passengers at time of travel. (inclusive)
              example: 16
            max_age:
              type: integer
              minimum: 0
              maximum: 1000
              description: Maximum age of all passengers at time of travel (inclusive)
            passenger_sex:
              type: array
              description: Permitted sex of all passengers.
              items:
                type: string
                enum:
                - m
                - f
    ElementOptionParams:
      type: object
      properties:
        category_id:
          $ref: '#/components/schemas/ID'
        name:
          type: string
        occupancy:
          $ref: '#/components/schemas/Occupancy'
        price_unit:
          $ref: '#/components/schemas/PriceUnit'
        published:
          type: boolean
          default: true
        web_bookable:
          type: boolean
          default: true
        is_lead:
          type: boolean
          default: true
    ElementOptionCreate:
      type: object
      required:
      - name
      - category_id
      - occupancy
      - price_unit
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/ElementOptionParams'
    DepartureParams:
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        range_type:
          $ref: '#/components/schemas/DepartureRangeType'
        inventory:
          $ref: '#/components/schemas/Inventory'
    DepartureProperties:
      type: object
      required:
      - start
      - end
      - inventory
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/DepartureParams'
    ItineraryEntryParams:
      type: object
      properties:
        start_day:
          type: integer
          minimum: 1
        end_day:
          type: integer
          minimum: 1
        title:
          type: string
        description:
          type: string
        introduction:
          type: string
        published:
          type: boolean
        includes_breakfast:
          type: boolean
        includes_lunch:
          type: boolean
        includes_dinner:
          type: boolean
    ItineraryEntryProperties:
      type: object
      required:
      - start_day
      - end_day
      - title
      additionalProperties: false
      allOf:
      - $ref: '#/components/schemas/ItineraryEntryParams'
  parameters:
    HolidaySearchSearch:
      name: search
      in: query
      required: false
      description: (UI) Holiday search query
      schema:
        type: string
    HolidaySearchName:
      name: name
      in: query
      required: false
      description: Filter holidays by name (contains)
      schema:
        type: string
    HolidaySearchCode:
      name: code
      in: query
      required: false
      description: Filter holidays by code (prefix)
      schema:
        type: string
    HolidaySearchPage:
      name: page
      in: query
      required: false
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
    HolidaySearchLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of results to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    HolidaySearchOrder:
      name: order
      in: query
      required: false
      description: Sort order
      schema:
        $ref: '#/components/schemas/SortOrder'
    HolidaySearchSort:
      name: sort
      in: query
      required: false
      description: Sort field
      schema:
        type: string
        enum:
        - id
        - code
        - name
        - ordering
        - created_at
        - updated_at
        - deleted_at
    HolidaySearchTrash:
      name: trash
      in: query
      required: false
      description: View trash instead of active records if true
      schema:
        type: integer
        enum:
        - 0
        - 1
    HolidaySearchPublished:
      name: published
      in: query
      required: false
      description: Filter holidays by their publish state
      schema:
        type: integer
        enum:
        - 0
        - 1
    HolidayIdPath:
      name: holiday_id
      in: path
      required: true
      description: Holiday ID
      schema:
        type: string
        minLength: 26
        maxLength: 26
    VersionIdPath:
      name: version_id
      in: path
      required: true
      description: Holiday Version ID
      schema:
        type: string
        minLength: 26
        maxLength: 26
    VersionPath:
      name: version
      required: true
      in: path
      description: Version ID
      schema:
        $ref: '#/components/schemas/ID'
    ElementPath:
      name: element
      required: true
      in: path
      description: Element ID
      schema:
        $ref: '#/components/schemas/ID'
    OptionPath:
      name: option
      in: path
      required: true
      description: Option ID
      schema:
        $ref: '#/components/schemas/ID'
    CategoryChildren:
      name: children
      in: query
      required: false
      description: Include child categories on returned results
      schema:
        type: boolean
    CategoryParentId:
      name: parent_id
      in: query
      required: false
      description: Filter by parent ID
      schema:
        $ref: '#/components/schemas/ID'
    CategoryNameQuery:
      name: name
      in: query
      required: false
      description: Filter by name
      schema:
        type: string
    CategorySearch:
      name: search
      in: query
      required: false
      description: Free-text search
      schema:
        type: string
    CategorySort:
      name: sort
      in: query
      required: false
      description: Sort, defaults to category order
      schema:
        type: string
        enum:
        - id
        - name
        - parent_id
        - created_at
        - updated_at
    CategoryOrder:
      name: order
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SortOrder'
    CategoryPublished:
      name: published
      in: query
      required: false
      description: Filter Categories by their publish state
      schema:
        type: integer
        enum:
        - 0
        - 1
    CategorySearchable:
      name: searchable
      in: query
      required: false
      description: Filter Categories by their searchability
      schema:
        type: integer
        enum:
        - 0
        - 1
    CategoryPage:
      name: page
      in: query
      required: false
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1
    CategoryLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of results to return
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  requestBodies:
    UpdateHoliday:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              name:
                type: string
                description: Holiday Name
              code:
                type: string
                description: Holiday Code
                minLength: 2
                maxLength: 16
                pattern: /^[A-Z0-9][A-Z0-9-]*$/
                example: H001
              introduction:
                type: string
                nullable: true
              description:
                type: string
                nullable: true
                description: Holiday description (HTML Content)
              fields:
                $ref: '#/components/schemas/CustomFieldsData'
              published:
                type: boolean
                description: Determines if the holiday is publicly viewable.
              ordering:
                $ref: '#/components/schemas/OrderingCommand'
    CreateHoliday:
      description: New Holiday Payload
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - name
            - code
            properties:
              name:
                type: string
                description: Holiday Name
              code:
                type: string
                description: Holiday Code
                minLength: 2
                maxLength: 16
                pattern: /^[A-Z0-9][A-Z0-9-]*$/
                example: H001
              introduction:
                type: string
              description:
                type: string
                description: Holiday description (HTML Content)
              published:
                type: boolean
                default: false
                description: Determines if the holiday is publicly viewable.
  responses:
    CategoryListSuccess:
      description: Category list
      content:
        application/json:
          schema:
            type: object
            properties:
              total:
                type: integer
                minimum: 0
                description: Total number of matching holidays
              current_page:
                type: integer
                minimum: 1
                description: Current page number
              last_page:
                type: integer
                minimum: 1
                description: Total number of pages
              from:
                type: integer
                minimum: 1
                description: Index of the first result on the current page.
              to:
                type: integer
                minimum: 1
                description: Index of the last result on the current page.
              data:
                type: array
                description: Matching Categories
                items:
                  $ref: '#/components/schemas/Category'
    GenericError:
      description: Error
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            required:
            - message
            properties:
              message:
                type: string
                example: Resource not found
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          example:
            error: Unauthorized
    ValidationError:
      description: Validation Error
      content:
        application/json:
          example:
            message: name must be a string. (and 2 more errors)
            errors:
              name:
              - The name must be a string
              - The name must be at least 2 characters
              code:
              - The code format is invalid
          schema:
            type: object
            required:
            - message
            - errors
            properties:
              message:
                type: string
                description: Validation error message
              errors:
                type: object
                description: Key-value mapping of fields to their validation errors
                additionalProperties:

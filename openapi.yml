      enum:
      - asc
      - desc
    OrderingCommand:
      type: string
      title: Re-ordering command
      description: Re-ordering command word
      enum:
      - up
      - down
      - first
      - last
    Category:
      type: object
      title: Category
      properties:
        id:
          $ref: '#/components/schemas/ID'
        created_at:
